# HoneyLens Cowrie configuration (overrides cowrie.cfg.dist, Cowrie v3.1.1)
# ---------------------------------------------------------------------
# Cowrie reads its built-in defaults first, then this file. We only list
# settings we deliberately change, each with the reason.

[honeypot]
# A believable server name. Attackers' bots print it; "svr04" (the default) is
# a well-known Cowrie fingerprint, so we change it.
hostname = web-prod-02
# Logs and state live in var/ which is a Docker named volume (shared read-only
# with the pipeline).
log_path = var/log/cowrie
state_path = var/lib/cowrie
download_path = ${honeypot:state_path}/downloads
# Rotate cowrie.json daily (cowrie.json -> cowrie.json.YYYY-MM-DD). The pipeline
# handles rotation by tracking files by inode.
logtype = rotating
timezone = UTC
# Overlay realistic /etc/issue, /etc/motd, /etc/os-release on top of the fake filesystem.
contents_path = /cowrie/honeyfs
# Users and the fake passwords that "work" (see userdb.txt).
auth_class = UserDB
# Kick idle attackers after 3 minutes so connections do not pile up.
idle_timeout = 180
authentication_timeout = 60
# SAFETY: never really download attacker files.
#  1. bind outbound connections to loopback, so connections to the internet fail
#     (the integration test checks that a download attempt fails),
#  2. cap transfers at 1 MiB (Cowrie also uses this limit for typed input, so a
#     tiny value like 1 byte breaks normal sessions - found during testing),
#  3. (cloud) the host firewall also drops all outbound traffic from Cowrie.
out_addr = 127.0.0.1
download_limit_size = 1048576
# Do not keep full TTY recordings by default (they can contain pasted malware).
ttylog = false

[shell]
# Look like a current Debian 12 x86_64 server.
arch = linux-x64-lsb
kernel_version = 6.1.0-28-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.119-1 (2024-11-22)
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
# The banner real Debian 12 OpenSSH sends.
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
# Container listens on 2222 (non-root cannot bind port 22). Compose maps the port.
listen_endpoints = tcp:2222:interface=0.0.0.0
# SAFETY: no port forwarding / tunnelling through the honeypot.
forwarding = false
forward_redirect = false
forward_tunnel = false
# No SFTP uploads (would store attacker files = captured samples).
sftp_enabled = false
auth_keyboard_interactive_enabled = false

[telnet]
# Telnet is OFF by default (SSH is the focus; Telnet doubles the noise).
enabled = false
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
# JSON lines: one event per line, read by the HoneyLens pipeline.
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = false
