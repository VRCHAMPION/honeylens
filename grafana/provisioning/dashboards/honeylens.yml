# Load every dashboard JSON in /var/lib/grafana/dashboards into a "HoneyLens"
# folder. allowUiUpdates=false: the files are the source of truth.
apiVersion: 1
providers:
  - name: honeylens
    folder: HoneyLens
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
